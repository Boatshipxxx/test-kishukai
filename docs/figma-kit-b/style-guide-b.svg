<text x="60" y="1192" font-family="Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">・角丸は全要素 0px ／ 罫線は黒15%の1pxヘアライン ／ カード間は1pxギャップのグリッド</text>
<text x="60" y="1216" font-family="Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">・アクセントは金を主・紅を副。同一要素に両方は使わない ／ 写真は黒系グラデのプレースホルダー（差し替え前提）</text>
<text x="60" y="1240" font-family="Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">・フォント: Oswald（英字見出し）・Noto Sans JP（日本語）— どちらもFigmaのGoogle Fontsで選択可</text>
